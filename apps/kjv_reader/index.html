<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Read the King James Version (KJV) and see it modernized in real modern English.">
  <title>KJV Reader — StudyTools</title>
  <link rel="stylesheet" href="../../css/base.css">
  <script src="../../js/theme.js"></script>
  <style>
    .ref-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
    .ref-bar .grow { flex: 1; min-width: 200px; }
    .verse-block { border-bottom: 1px solid var(--line); padding: 14px 0; }
    .verse-num { font-family: var(--mono); font-size: .74rem; color: var(--accent); margin-bottom: 4px; }
    .verse-text { font-family: var(--serif); font-size: 1.1rem; line-height: 1.6; margin-bottom: 8px; }
    .verse-modern { font-family: var(--sans); font-size: 0.95rem; color: var(--ink-soft); font-style: italic; background: var(--accent-soft); padding: 8px; border-radius: 4px; display: none; }
    .verse-modern.visible { display: block; }
    .modernize-btn { font-size: 0.7rem; padding: 2px 6px; background: var(--accent); color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 4px; }
    .modernize-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .chapter-nav { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
    .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.2); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .loading-overlay.visible { display: flex; }
  </style>
</head>
<body data-root="../../" data-app="kjv_reader">
<div data-topbar></div>

<main class="wrap">
  <header class="page">
    <h1>KJV Reader</h1>
    <p class="lede">Read the classic King James Version. Use the button below each verse to modernize it into real modern English using AI.</p>
  </header>

  <section class="card no-print">
    <div class="ref-bar">
      <div class="grow">
        <label class="field" for="ref">Reference</label>
        <input id="ref" type="text" placeholder="Genesis 1" autocomplete="off" spellcheck="false" style="font-family:var(--serif)">
      </div>
      <div>
        <label class="field" for="book">Book</label>
        <select id="book" style="min-width:170px"></select>
      </div>
      <div>
        <label class="field" for="chapter">Chapter</label>
        <select id="chapter" style="min-width:90px"></select>
      </div>
      <button id="go">Read</button>
    </div>
  </section>

  <section id="reader" style="margin-top:16px">
    <div class="card"><p class="muted">Choose a passage to read.</p></div>
  </section>

  <footer class="site">
    <p>KJV text is public domain. Modernization is powered by local Ollama (gemma4:26b).</p>
  </footer>
</main>

<div id="loading" class="loading-overlay">
  <div class="card">Modernizing...</div>
</div>

<script src="../../js/common.js"></script>
<script src="app.js"></script>
</body>
</html>
