<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunday Lectionary — StudyTools</title>
<meta name="description" content="The psalms and lessons appointed for every Sunday of the Christian year in the Book of Common Prayer (1928), public domain, each reading opening in Study a Passage.">
<link rel="stylesheet" href="../../css/base.css">
<script src="../../js/theme.js"></script>
<style>
  .years { display: flex; flex-wrap: wrap; gap: 6px; }
  .years button { font-size: .84rem; padding: 5px 13px; background: transparent; color: var(--ink-soft); border-color: var(--line); }
  .years button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-soft); }
  .next { border-left: 3px solid var(--accent-2); }
  .sub { color: var(--ink-faint); font-size: .82rem; margin: 0 0 4px; }
  #today { margin-bottom: 16px; }
  .day { border-bottom: 1px solid var(--line); padding: 12px 0; }
  .day:last-child { border-bottom: 0; }
  .day h3 { font-family: var(--serif); font-size: 1.02rem; margin: 0 0 2px; }
  .day .season { color: var(--ink-faint); font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; }
  .office { margin-top: 8px; }
  .office-title { font-size: .72rem; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint); }
  .readings { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 4px 14px; margin-top: 6px; }
  .reading { font-size: .92rem; }
  .reading .kind { color: var(--ink-faint); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; margin-right: 6px; }
  @media print { .years, header.page p { display: none !important; } .day { break-inside: avoid; } }
</style>
</head>
<body data-root="../../" data-app="lectionary">
<div data-topbar></div>

<main class="wrap">
  <header class="page">
    <h1>Sunday Lectionary</h1>
    <p class="lede">The psalms and lessons appointed for every Sunday of the Christian year in the Book of Common Prayer (1928), which is in the public domain. Open any reading to study it, or send it to the lectern to read aloud.</p>
  </header>

  <section class="card no-print">
    <div class="years" id="seasons" role="group" aria-label="Choose a season"></div>
  </section>

  <section id="today"></section>

  <section id="out"></section>
</main>

<script src="../../js/common.js"></script>
<script src="app.js"></script>
</body>
</html>
